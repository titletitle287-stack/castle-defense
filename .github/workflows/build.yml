name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: notfl3/cargo-apk
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo quad-apk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: castle-defense-apk
          path: target/android-artifacts/release/apk/*.apk
